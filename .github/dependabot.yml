version: 2
updates:
  # Java libraries in the Clinic API lab
  - package-ecosystem: maven
    directory: /clinic-api-lab
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Versions of the GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
