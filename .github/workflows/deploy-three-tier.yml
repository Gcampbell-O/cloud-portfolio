name: Three-Tier Network - Bicep Deploy

on:
  pull_request:
    paths:
      - 'three-tier-network-iac/**'
  push:
    branches: [main]
    paths:
      - 'three-tier-network-iac/**'

permissions:
  id-token: write
  contents: read

jobs:
  plan:
      apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group rg-three-tier-lab \
            --template-file three-tier-network-iac/main.bicep \
            --parameters sshPublicKey='${{ secrets.AZURE_SSH_PUBLIC_KEY }}' principalId='${{ secrets.AZURE_PRINCIPAL_ID }}'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if deployment
        run: |
          az deployment group what-if \
            --resource-group rg-three-tier-lab \
            --template-file three-tier-network-iac/main.bicep \
            --parameters sshPublicKey='${{ secrets.AZURE_SSH_PUBLIC_KEY }}' principalId='${{ secrets.AZURE_PRINCIPAL_ID }}'
