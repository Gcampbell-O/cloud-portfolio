name: IaC Security Scan

# Static analysis of every Bicep file in the repo. No Azure login, no deployment.
on:
  pull_request:
    paths:
      - '**/*.bicep'
      - '.github/workflows/iac-security-scan.yml'
  push:
    branches: [main]
    paths:
      - '**/*.bicep'
      - '.github/workflows/iac-security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # soft_fail: report findings without failing the build (like Azure Policy "Audit").
      # Switch to false once findings are fixed or justified (like "Deny").
      - name: Run Checkov on Bicep
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: bicep
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Upload results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov-bicep
